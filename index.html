<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заброшки. Зима 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;line-height:1.6;color:#333}
.hero{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-align:center;padding:100px 20px}
.hero h1{font-size:3em;margin-bottom:20px}
.hero p{font-size:1.3em;max-width:600px;margin:0 auto}
.section{max-width:800px;margin:0 auto;padding:60px 20px}
.section h2{font-size:2em;margin-bottom:30px;color:#667eea}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:5px;font-weight:bold}
.form-group input,.form-group select{width:100%;padding:12px;border:1px solid #ddd;border-radius:5px;font-size:16px}
button{background:#667eea;color:#fff;padding:15px 40px;border:none;border-radius:5px;font-size:18px;cursor:pointer}
button:hover{background:#5568d3}
.photo{text-align:center;margin:40px 0}
.photo img{max-width:100%;border-radius:10px}
.rules{background:#f8f9fa;padding:30px;border-radius:10px}
.contacts{background:#667eea;color:#fff;padding:30px;border-radius:10px}
.success{display:none;background:#d4edda;color:#155724;padding:20px;border-radius:5px;margin-top:20px}
.error{display:none;background:#f8d7da;color:#721c24;padding:20px;border-radius:5px;margin-top:20px}
</style>
</head>
<body>
<div class="hero">
<h1>🏃 Заброшки. Зима 2026</h1>
<p>Беговое мероприятие на свежем воздухе. Присоединяйся!</p>
</div>
<div class="section"><div class="photo"><img src="photo.jpg" alt="Заброшки"></div></div>
<div class="section"><h2>О мероприятии</h2><p>Здесь будет описание.</p></div>
<div class="section">
<h2>Регистрация</h2>
<form id="registrationForm">
<div class="form-group"><label>ФИО</label><input type="text" name="fullname" required placeholder="Иванов Иван"></div>
<div class="form-group"><label>Телефон</label><input type="tel" name="phone" required placeholder="+7 (999) 123-45-67"></div>
<div class="form-group"><label>Нужен трансфер?</label><select name="transfer"><option value="yes">Да</option><option value="no">Нет</option></select></div>
<button type="submit">Зарегистрироваться</button>
</form>
<div class="success" id="successMessage">✅ Регистрация успешна!</div>
<div class="error" id="errorMessage">❌ Ошибка. Попробуйте позже.</div>
</div>
<div class="section"><h2>Правила</h2><div class="rules"><p>Здесь будут правила.</p></div></div>
<div class="section"><h2>Положение</h2><div class="rules"><p>Здесь будет положение.</p></div></div>
<div class="section"><h2>Контакты</h2><div class="contacts"><p>📧 info@zabroshki.ru</p><p>📱 +7 (999) 123-45-67</p></div></div>
<script>
document.getElementById('registrationForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const data = {
        fullname: form.fullname.value,
        phone: form.phone.value,
        transfer: form.transfer.value
    };
    
    try {
        const res = await fetch('https://npopgnchdubsqzkuozsu.supabase.co/rest/v1/registrations', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'apikey': 'sb_publishable_s3GQJCnO-zogh9xULErKGw_ykWlVbxe',
                'Prefer': 'return=minimal'
            },
            body: JSON.stringify(data)
        });
        
        if (res.ok) {
            document.getElementById('successMessage').style.display = 'block';
            form.reset();
        } else {
            document.getElementById('errorMessage').style.display = 'block';
        }
    } catch (err) {
        document.getElementById('errorMessage').style.display = 'block';
    }
});
</script>
</body>
</html>
